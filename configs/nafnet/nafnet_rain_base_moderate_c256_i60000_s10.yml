# SceneWx condition: rain / base / moderate, crop 256, 60000 iters, seed 10.
# Generated by configs/make_configs.py. Severity-matched by calibration/calibration_cells.json
# (target 0.0428, GT-RAIN (real)).
# No datasets.val block on purpose (NAFNet's train.py single-GPU validation crash).
name: nafnet_rain_base_moderate_c256_i60000_s10
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: nafnet_rain_base_moderate_c256_i60000_s10-train
    type: SceneWxPairedDataset
    weather: rain
    cell: base
    level: moderate
    split: train
    seed: 10
    gt_size: 256
    phase: train
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_g:
  type: NAFNet
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 60000
    eta_min: !!float 1e-7
  total_iter: 60000
  warmup_iter: -1
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 15000
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29491
